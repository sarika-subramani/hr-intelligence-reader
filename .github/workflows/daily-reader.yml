
name: Daily HR Intelligence Reader

on:
  schedule:
    # 8:00 AM India time = 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hr-reader-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily HR Reader
        env:
          OPENAI_API_KEY: ${{ secrets.HR_NEWS_READER }}
          OPENAI_MODEL: gpt-5.5
        run: python generate_reader.py

      - name: Save new edition to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily HR Reader"
            git push
          fi

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html editions.json _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

